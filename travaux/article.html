<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Stella Yathe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .docs-box{max-width:72ch;margin:56px auto 0}
    .docs-box .eyebrow{display:block;margin-bottom:16px}
    .doc{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;padding:18px 20px;background:var(--paper);border:1px solid var(--line);margin-bottom:10px;transition:.25s}
    .doc:hover{border-color:var(--brass);transform:translateY(-2px)}
    .ftype{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--brass);color:var(--brass);text-align:center}
    .fname{font-family:var(--serif);font-size:1.25rem}
    .fgo{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--navy)}
    .doc:hover .fgo{color:var(--brass)}
    @media(max-width:600px){.doc{grid-template-columns:1fr;gap:8px}.ftype{justify-self:start}}
  </style>
</head>
<body>

  <!-- NAV -->
  <header class="nav">
    <div class="wrap">
      <a href="../index.html" class="brand">Stella <span>YATHE</span></a>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="../projet/index.html">Project</a></li>
          <li><a href="index.html" class="active">Work</a></li>
          <li><a href="../cv/index.html">CV &amp; Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- HEADER (filled by the script) -->
  <section class="page-head">
    <div class="wrap">
      <div class="article-meta"><span id="a-cat">Work</span><span id="a-date"></span></div>
      <h1 id="a-title" style="margin-top:16px">Loading…</h1>
      <p id="a-excerpt"></p>
    </div>
  </section>

  <!-- BODY -->
  <section class="block">
    <div class="wrap">
      <article class="prose" id="a-body"></article>

      <div class="docs-box" id="docs-box" style="display:none">
        <span class="eyebrow">Documents to download</span>
        <div id="docs-list"></div>
      </div>

      <div class="article-actions">
        <a href="index.html" class="link-arrow">← All work</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="wrap">
      <span>© 2026 Stella Yathe</span>
      <span>Corporate Finance · Valuation · M&amp;A</span>
    </div>
  </footer>

  <script type="module">
    import { db } from "../assets/js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Stored categories are in French; display them in English
    const CAT = { "Analyse d'entreprise": "Company analysis", "Concept financier": "Financial concept", "Rapport annuel": "Annual report", "Transaction M&A": "M&A transaction" };
    const $ = (id) => document.getElementById(id);
    const esc = (s = "") => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

    // Light formatting: **bold**, *italic*, [text](https://link), ![alt](image)
    function inline(s) {
      return esc(s)
        .replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+|[^)\s:]+)\)/g, '<img src="$2" alt="$1">')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>");
    }

    // ## Title · ### Subtitle · - bullet · > quote · blank line = new paragraph
    function render(text) {
      let html = "", inList = false, para = [];
      const flushP = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
      const closeL = () => { if (inList) { html += "</ul>"; inList = false; } };
      for (const raw of String(text).replace(/\r/g, "").split("\n")) {
        const l = raw.trim();
        if (!l) { flushP(); closeL(); continue; }
        if (l.startsWith("### "))      { flushP(); closeL(); html += "<h3>" + inline(l.slice(4)) + "</h3>"; }
        else if (l.startsWith("## "))  { flushP(); closeL(); html += "<h2>" + inline(l.slice(3)) + "</h2>"; }
        else if (l.startsWith("> "))   { flushP(); closeL(); html += "<blockquote>" + inline(l.slice(2)) + "</blockquote>"; }
        else if (/^!\[/.test(l))       { flushP(); closeL(); html += inline(l); }
        else if (/^[-•] /.test(l))     { flushP(); if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(l.slice(2)) + "</li>"; }
        else                           { closeL(); para.push(l); }
      }
      flushP(); closeL();
      return html;
    }

    // Document type from the extension
    function fileType(url) {
      const ext = (url.split("?")[0].split(".").pop() || "").toLowerCase();
      if (ext === "pdf") return "PDF";
      if (["xlsx", "xlsm", "xls", "csv"].includes(ext)) return "Excel";
      if (["pptx", "ppt"].includes(ext)) return "PowerPoint";
      if (["docx", "doc"].includes(ext)) return "Word";
      return "File";
    }
    // http(s) or relative path only
    const safeUrl = (u) => /^https?:\/\//i.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u);

    const notFound = () => {
      $("a-title").textContent = "Publication not found";
      $("a-excerpt").textContent = "This publication does not exist or is not available yet.";
      $("a-cat").textContent = "Work";
    };

    (async () => {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) return notFound();
      try {
        const snap = await getDoc(doc(db, "travaux", id));
        if (!snap.exists()) return notFound();
        const w = snap.data();

        document.title = (w.title || "Work") + " — Stella Yathe";
        $("a-cat").textContent = CAT[w.category] || w.category || "Work";
        const d = w.date?.toDate ? w.date.toDate() : (w.date ? new Date(w.date) : null);
        $("a-date").textContent = d && !isNaN(d) ? d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }) : "";
        $("a-title").textContent = w.title || "";
        $("a-excerpt").textContent = w.excerpt || "";
        $("a-body").innerHTML = render(w.content || "");

        // Documents: new "files" list, or legacy "pdfUrl" field
        let files = Array.isArray(w.files) ? w.files.slice() : [];
        if (!files.length && w.pdfUrl) files = [{ label: "Download the PDF", url: w.pdfUrl }];
        files = files.filter(f => f && f.url && safeUrl(f.url));
        if (files.length) {
          $("docs-list").innerHTML = files.map(f => `
            <a class="doc" href="${esc(f.url)}" target="_blank" rel="noopener">
              <span class="ftype">${fileType(f.url)}</span>
              <span class="fname">${esc(f.label || f.url.split("/").pop())}</span>
              <span class="fgo">Download →</span>
            </a>`).join("");
          $("docs-box").style.display = "";
        }
      } catch (e) {
        console.warn(e);
        notFound();
      }
    })();
  </script>
</body>
</html>
