<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work — Stella Yathe</title>
  <meta name="description" content="Company analyses, financial concepts, annual reports and M&amp;A transaction readings.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <!-- NAV -->
  <header class="nav">
    <div class="wrap">
      <a href="../index.html" class="brand">Stella <span>YATHE</span></a>
      <nav>
        <ul>
          <li><a href="../index.html">Home</a></li>
          <li><a href="index.html" class="active">Work</a></li>
          <li><a href="../cv/index.html">Profile &amp; Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- HEADER -->
  <section class="page-head">
    <div class="wrap">
      <span class="eyebrow">Work</span>
      <h1>Analyses &amp; research</h1>
      <p>Each study of a company or a concept becomes a publication: method, figures, conclusion.</p>
    </div>
  </section>

  <!-- LIST -->
  <section class="block">
    <div class="wrap">

      <div class="filters" id="filters">
        <button class="chip on" data-cat="all">All</button>
        <button class="chip" data-cat="Analyse d'entreprise">Company analyses</button>
        <button class="chip" data-cat="Concept financier">Financial concepts</button>
        <button class="chip" data-cat="Rapport annuel">Annual reports</button>
        <button class="chip" data-cat="Transaction M&A">Transactions / M&amp;A</button>
      </div>

      <!-- Filled by main.js from Firestore (category values stay in French: they match the stored data) -->
<div class="grid" id="works"></div>

      <p id="empty" style="display:none;color:var(--muted);margin-top:24px">No publication in this category yet.</p>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="wrap">
      <span>© 2026 Stella Yathe</span>
      <span>Corporate Finance · Valuation · M&amp;A</span>
    </div>
  </footer>

  <!-- Category filter (also works on dynamically loaded cards) -->
  <script>
    document.getElementById('filters').addEventListener('click', function (e) {
      var chip = e.target.closest('.chip');
      if (!chip) return;
      document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('on'); });
      chip.classList.add('on');
      var cat = chip.dataset.cat, shown = 0;
      document.querySelectorAll('#works .card').forEach(function (card) {
        var ok = cat === 'all' || card.dataset.cat === cat;
        card.style.display = ok ? '' : 'none';
        if (ok) shown++;
      });
      document.getElementById('empty').style.display = shown ? 'none' : 'block';
    });
  </script>
  <script type="module" src="../assets/js/main.js"></script>
</body>
</html>
